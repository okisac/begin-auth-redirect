<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        window.onload = function() {
            const currentUrl = window.location.href;
            const urlObj = new URL(currentUrl);
            
            
            const search = urlObj.search; 
            const hash = urlObj.hash;     
            
            
            const deepLinkUrl = `begin://auth-callback${search}${hash}`;
            
            
           const fallbackLink = document.getElementById('openAppBtn');
            if (fallbackLink) {
                fallbackLink.href = deepLinkUrl;
            }

            
            window.location.href = deepLinkUrl;
            
            
            setTimeout(() => {
                const fallbackDiv = document.getElementById('fallback');
                if (fallbackDiv) {
                    fallbackDiv.style.display = 'block';
                }
            }, 1000);
        };
    </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h3>Redirecting to app...</h3>
    <p>Please wait, you will be redirected to the app shortly.</p>
    
    <div id="fallback" style="display:none; margin-top: 20px;">
        <p>If the app didn't open automatically:</p>
        <!-- DİKKAT: Buraya id="openAppBtn" eklendi! -->
        <a id="openAppBtn" href="#" style="padding: 10px 20px; background: #000; color: #fff; text-decoration: none; border-radius: 5px; display: inline-block;">Open App</a>
    </div>
</body>
</html>
